[project]
name = "robot-policy-overfitting-study"
version = "0.1.0"
description = "Code, data and checkpoints for the robot policy overfitting study (MimicGen experiments)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.12.0",
    "diffusers==0.11.1",
    "hydra-core==1.2.0",
    # Critical compatibility pins for the robomimic + MimicGen stack.
    "mujoco==2.3.2",
    "numpy<2",
    "omegaconf",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    # Forked upstream repos are part of the locked workspace.
    "mimicgen",
    "robomimic",
    "robosuite",
    # Direct runtime dependencies from robosuite, robomimic, and MimicGen.
    "chardet<6",
    "egl-probe>=1.0.1",
    "gdown",
    "h5py",
    "huggingface_hub<0.26",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "numba>=0.49.1",
    "opencv-python",
    "pillow",
    "psutil",
    "pynput",
    "scipy>=1.2.3",
    "setuptools",
    "zarr<3",
    "tensorboard",
    "tensorboardX",
    "termcolor",
    "tqdm",
    "nvitop>=1.6.2",
    "wandb",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff==0.15.0",
]

[tool.uv.sources]
mimicgen = { path = "third_party/mimicgen", editable = true }
robomimic = { path = "third_party/robomimic", editable = true }
robosuite = { path = "third_party/robosuite", editable = true }

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

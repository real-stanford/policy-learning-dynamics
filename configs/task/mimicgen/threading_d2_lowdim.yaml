name: threading_d2_lowdim
benchmark: mimicgen_core
task_name: threading_d2
modality: lowdim

observation:
  notes:
    - Source of truth for MimicGen observation keys is envs/task_registry.py.
    - Keep this task config aligned with the registry entry for task_name.
  state_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
  rgb_keys: []
  obs_dim: 37
  # State dims dropped by the forward-dynamics model ONLY (the policy uses the full
  # state). Threading has two objects (needle, tripod); each contributes a relative-
  # to-eef pose block that is exactly recomputable from the absolute object/eef poses
  # (redundant) and whose relative quat double-cover sign-flips (discontinuous):
  #   needle_to_eef_pos (7-9), needle_to_eef_quat (10-13),
  #   tripod_to_eef_pos (21-23), tripod_to_eef_quat (24-27).
  # Consumed via dataset/dynamics_lowdim.yaml.
  dynamics_drop_state_indices: []
  # dynamics_drop_state_indices: [7, 8, 9, 10, 11, 12, 13, 21, 22, 23, 24, 25, 26, 27]

action:
  axis_angle_dim: 7
  rotation6d_dim: 10
  model_dim: ${eval:'${task.action.rotation6d_dim} if "${action.rotation_rep}" == "rotation_6d" else ${task.action.axis_angle_dim}'}

data:
  hdf5_path: ${oc.env:MIMICGEN_DATA_ROOT}/core/threading_d2.hdf5
  zarr_path: ${oc.env:MIMICGEN_DATA_ROOT}/core/threading_d2_lowdim${action.zarr_suffix}.zarr

training:
  num_epochs: 800
  save_every: 50
  val_every: 1
  sample_every: 5

evaluation:                 # closed-loop rollouts (scripts/eval_checkpoints.py)
  kind: robomimic_lowdim
  dataset_path: ${task.data.hdf5_path}
  test_start_seed: 100000
  max_steps: 400
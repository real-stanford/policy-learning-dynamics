name: square_d2_lowdim
benchmark: mimicgen_core
task_name: square_d2
modality: lowdim

observation:
  notes:
    - Source of truth for MimicGen observation keys is envs/task_registry.py.
    - Keep this task config aligned with the registry entry for task_name.
  state_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
  rgb_keys: []
  obs_dim: 26
  # State dims dropped by the forward-dynamics model ONLY (the policy uses the full
  # state). These are the SquareNut-to-eef relative pose: SquareNut_to_robot0_eef_pos
  # (7-9) and SquareNut_to_robot0_eef_quat (10-13) -- exactly recomputable from the
  # absolute nut/eef poses (redundant), and the relative quat double-cover sign-flips
  # (discontinuous). Consumed via dataset/dynamics_lowdim.yaml.
  # dynamics_drop_state_indices: [7, 8, 9, 10, 11, 12, 13]
  dynamics_drop_state_indices: []

action:
  axis_angle_dim: 7
  rotation6d_dim: 10
  model_dim: ${eval:'${task.action.rotation6d_dim} if "${action.rotation_rep}" == "rotation_6d" else ${task.action.axis_angle_dim}'}

data:
  hdf5_path: ${oc.env:MIMICGEN_DATA_ROOT}/core/square_d2.hdf5
  zarr_path: ${oc.env:MIMICGEN_DATA_ROOT}/core/square_d2_lowdim${action.zarr_suffix}.zarr

training:
  num_epochs: 800
  save_every: 50
  val_every: 1
  sample_every: 5

evaluation:                 # closed-loop rollouts (scripts/eval_checkpoints.py)
  kind: robomimic_lowdim
  dataset_path: ${task.data.hdf5_path}
  test_start_seed: 100000
  max_steps: 400

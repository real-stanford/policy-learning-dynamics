name: diffusion_unet_image

references:
  primary_repo: diffusion_policy
  policy_class: DiffusionUnetImagePolicy
  backbone_class: ConditionalUnet1D

rollout:
  horizon: 8
  n_obs_steps: 1
  n_action_steps: 8
  n_latency_steps: 0
  pad_before: 1
  pad_after: 7
  obs_conditioning: global

unet:
  diffusion_step_embed_dim: 128
  down_dims:
    - 512
    - 1024
    - 2048
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

scheduler:
  type: ddim
  num_train_timesteps: 100
  num_inference_steps: 16
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  set_alpha_to_one: true
  steps_offset: 0

# scheduler:
#   type: ddpm
#   num_train_timesteps: 100
#   num_inference_steps: 100
#   beta_start: 0.0001
#   beta_end: 0.02
#   beta_schedule: squaredcos_cap_v2
#   variance_type: fixed_small
#   clip_sample: true
#   prediction_type: epsilon

obs_encoder:
  backbone: resnet18
  weights: null
  resize_shape: null
  crop_shape:
    - 76
    - 76
  random_crop: true
  eval_fixed_crop: true
  group_norm: true
  share_backbone: false
  imagenet_norm: true
